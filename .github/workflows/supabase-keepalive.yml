# Mantém o projeto Supabase (plano gratuito) ativo.
# O Supabase pausa projetos gratuitos após ~7 dias sem atividade.
# Este workflow faz uma leitura simples (só leitura, chave anon) a cada 3 dias.
#
# Configurar uma vez no GitHub: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       ex.: https://abcdefghijkl.supabase.co
#   SUPABASE_ANON_KEY  a chave "anon public" (NUNCA a service_role)

name: Supabase keepalive

on:
  schedule:
    - cron: '17 12 */3 * *' # a cada 3 dias, 09:17 (horário de Brasília)
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

permissions:
  actions: write # necessário para o passo que evita o GitHub desativar o agendamento

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          for tentativa in 1 2 3; do
            status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/transparencia?select=colecao&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Tentativa $tentativa: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Supabase ativo."
              exit 0
            fi
            sleep 20
          done
          cat /tmp/resp.json
          echo "::error::Supabase não respondeu (HTTP $status). Verifique se o projeto foi pausado no painel."
          exit 1

      # O GitHub desliga workflows agendados após 60 dias sem commits no repositório.
      # Este passo reativa o agendamento automaticamente, sem criar commits.
      - name: Evitar que o GitHub desative o agendamento
        uses: liskin/gh-workflow-keepalive@v1

